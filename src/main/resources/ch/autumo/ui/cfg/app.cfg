# Internal autumo Documents Configuration.
# Application configuration template shipped with autumo-ui. Keys are read by BaseApp /
# ConfigurationManager; unset keys fall back to the defaults below. Values may be
# overridden on the command line with -D<key>=<value>.

# --- URLs ---------------------------------------------------------------------
url.purchase=https://autumo.ch
url.website=https://autumo.ch
url.documentation=https://products.autumo.ch
url.website.updates=https://products.autumo.ch
url.website.version.file=https://products.autumo.ch/xml/template.xml

# --- Contact ------------------------------------------------------------------
email.sales=info@autumo.ch
email.support=info@autumo.ch

# --- UI / window -------------------------------------------------------------
# Detach the menu bar to the macOS system menu bar (yes/no).
disableMacOSMenuDetach=no
# Show uncaught exceptions? If enabled, exceptions are shown in a dialog (yes/no).
showUncaughtExceptions=yes
# Stage style: DECORATED, UNDECORATED, TRANSPARENT, ...
primaryStageStyle=DECORATED

# --- Installer ---------------------------------------------------------------
# Operating systems for which the license step is skipped.
installer.licStepOverOS=mac,win

# --- Networking --------------------------------------------------------------
https.protocols=TLSv1,TLSv1.1,TLSv1.2

# --- Language ----------------------------------------------------------------
# Application language: 'de' or 'en'. Unset: the language of this desktop,
# 'en' when there is no catalogue for it.
# -Dapp.lang=<code> overrides this value.
#language=