<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e03030"/>
      <stop offset="1" stop-color="#a01010"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- dark button, subtle border -->
  <rect x="14" y="20" width="212" height="216" rx="36" ry="36" fill="url(#btn)" stroke="#2e2e2e" stroke-width="1.5"/>
  <!-- subtle glass highlight (top edge only) -->
  <rect x="14" y="20" width="212" height="56" rx="36" ry="36" fill="url(#glass)"/>
  <!-- UI text: centered on button, larger -->
  <text x="120" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="144" font-weight="700" fill="#e8e8e8" filter="url(#shadow)">UI</text>
  <!-- FX badge: rounded corners, overlaps button on top AND right -->
  <rect x="142" y="6" width="98" height="52" rx="11" ry="11" fill="url(#fx)" stroke="#660000" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="191" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-style="italic" font-weight="700" fill="#ffffff">FX</text>
</svg>
