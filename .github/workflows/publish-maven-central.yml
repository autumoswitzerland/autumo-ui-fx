name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git release tag to publish (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag format: $RELEASE_TAG"
            exit 1
          fi

          if ! git ls-remote --exit-code --refs \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}" | grep -q .; then
            echo "::error::Tag $RELEASE_TAG does not exist in the remote repository."
            exit 1
          fi

          echo "Release tag $RELEASE_TAG exists."

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Verify checked out version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Release tag: $RELEASE_TAG"
          echo "Commit: $(git rev-parse HEAD)"

          PROJECT_VERSION=$(grep -m1 '^version =' build.gradle | sed -E "s/version = ['\"]([^'\"]+)['\"].*/\1/")
          RELEASE_VERSION="${RELEASE_TAG#v}"

          echo "Project version: $PROJECT_VERSION"
          echo "Release version: $RELEASE_VERSION"

          if [[ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Git tag and project version do not match."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Publish to Maven Central
        run: ./gradlew --no-daemon publishAggregationToCentralPortal
