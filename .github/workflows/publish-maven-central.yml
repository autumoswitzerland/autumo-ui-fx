name: Publish to Maven Central

run-name: Publish ${{ github.ref_name }} to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Verify release tag
        shell: bash
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Ref type: $GITHUB_REF_TYPE"
          echo "Commit: $GITHUB_SHA"

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Publishing is only allowed from a Git tag."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Verify checked out version
        shell: bash
        run: |
          echo "Release tag: $GITHUB_REF_NAME"
          echo "Commit: $(git rev-parse HEAD)"

          PROJECT_VERSION=$(grep -m1 '^version =' build.gradle | sed -E "s/version = ['\"]([^'\"]+)['\"].*/\1/")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"

          echo "Project version: $PROJECT_VERSION"
          echo "Release version: $RELEASE_VERSION"

          if [[ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Git tag and project version do not match."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Publish to Maven Central
        run: ./gradlew --no-daemon publishAggregationToCentralPortal
